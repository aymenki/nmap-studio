name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include private scan output, credentials, or sensitive network data.
  - type: input
    id: version
    attributes:
      label: Nmap Studio version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and safe reproduction steps.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks performed
      description: Include relevant test results or sanitized diagnostics.
